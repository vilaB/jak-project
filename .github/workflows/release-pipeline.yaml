name: 🏭 Draft Release - ARM only (vilaB fork)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver Bump Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      release_version:
        description: 'Explicit release version (e.g. 0.3.8). If set, skips automatic version bump.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  cut_release:
    name: Cut Release
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.set_tag.outputs.new_tag }}
    steps:
      - name: Bump Version and Push Tag
        if: "!inputs.release_version"
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          default_bump: ${{ inputs.bump }}

      - name: Create Explicit Tag
        if: inputs.release_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/git/refs" \
            -f "ref=refs/tags/v${{ inputs.release_version }}" \
            -f "sha=${{ github.sha }}"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            TAG="v${{ inputs.release_version }}"
          else
            TAG="${{ steps.tag_version.outputs.new_tag }}"
          fi
          gh release create "$TAG" \
            --generate-notes \
            --draft \
            --repo "${{ github.repository }}"

      - name: Output new tag
        id: set_tag
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            echo "new_tag=v${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "new_tag=${{ steps.tag_version.outputs.new_tag }}" >> "$GITHUB_OUTPUT"
          fi

  build_macos_arm:
    needs:
      - cut_release
    name: "🍎 MacOS ARM"
    uses: ./.github/workflows/macos-build-arm.yaml
    with:
      cmakePreset: "Release-macos-arm64-clang-static"
      cachePrefix: "static-arm"
      uploadArtifacts: true
    secrets: inherit

  upload_artifacts:
    needs:
      - cut_release
      - build_macos_arm
    name: "Upload ARM Artifacts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.cut_release.outputs.new_tag }}

      - name: Prepare Artifact Folder
        run: mkdir -p ./ci-artifacts/final

      - uses: actions/download-artifact@v8
        with:
          path: ./ci-artifacts/

      - name: Display structure
        run: ls -Rl ./ci-artifacts/

      - name: Prepare ARM macOS Build Assets
        run: |
          set -x
          echo "=== Artifact structure before fix ==="
          ls -Rl ./ci-artifacts/ || true
          # download-artifact v8 may extract flat to ./ci-artifacts or to subdir - handle both
          if [ -d "./ci-artifacts/opengoal-macos-static-arm" ]; then
            BIN_SRC="./ci-artifacts/opengoal-macos-static-arm"
          else
            BIN_SRC="./ci-artifacts"
          fi
          echo "BIN_SRC contents:"
          find "$BIN_SRC" -type f | head -20 || true
          GK_PATH=$(find "$BIN_SRC" -name "gk" -type f | head -1)
          GOALC_PATH=$(find "$BIN_SRC" -name "goalc" -type f | head -1)
          EXTRACTOR_PATH=$(find "$BIN_SRC" -name "extractor" -type f | head -1)
          LSP_PATH=$(find "$BIN_SRC" -name "lsp" -type f | head -1)
          echo "Found GK:$GK_PATH GOALC:$GOALC_PATH EXTRACTOR:$EXTRACTOR_PATH LSP:$LSP_PATH"
          mkdir -p "$BIN_SRC/game" "$BIN_SRC/goalc" "$BIN_SRC/decompiler" "$BIN_SRC/lsp"
          [ -n "$GK_PATH" ] && cp -v -f "$GK_PATH" "$BIN_SRC/game/gk" || echo "gk not found"
          [ -n "$GOALC_PATH" ] && cp -v -f "$GOALC_PATH" "$BIN_SRC/goalc/goalc" || echo "goalc not found"
          [ -n "$EXTRACTOR_PATH" ] && cp -v -f "$EXTRACTOR_PATH" "$BIN_SRC/decompiler/extractor" || echo "extractor not found"
          [ -n "$LSP_PATH" ] && cp -v -f "$LSP_PATH" "$BIN_SRC/lsp/lsp" || echo "lsp not found"
          echo "=== BIN_SRC normalized ==="
          ls -Rl "$BIN_SRC" || true
          echo "=== SOURCE structure ==="
          ls -l ./.github/scripts/releases/ || true
          ls -l ./decompiler/config 2>&1 | head || true
          mkdir -p ./ci-artifacts/macos-arm
          if ./.github/scripts/releases/extract_build_unix.sh ./ci-artifacts/macos-arm "$BIN_SRC" ./; then
            echo "extract_build_unix.sh succeeded"
          else
            echo "extract_build_unix.sh FAILED with $?, attempting manual fallback"
            mkdir -p ./ci-artifacts/macos-arm/data/launcher ./ci-artifacts/macos-arm/data/decompiler ./ci-artifacts/macos-arm/data/game/graphics/opengl_renderer
            cp -v "$BIN_SRC/game/gk" ./ci-artifacts/macos-arm/gk 2>&1 || cp -v "$GK_PATH" ./ci-artifacts/macos-arm/gk || true
            cp -v "$BIN_SRC/goalc/goalc" ./ci-artifacts/macos-arm/goalc 2>&1 || cp -v "$GOALC_PATH" ./ci-artifacts/macos-arm/goalc || true
            cp -v "$BIN_SRC/decompiler/extractor" ./ci-artifacts/macos-arm/extractor 2>&1 || cp -v "$EXTRACTOR_PATH" ./ci-artifacts/macos-arm/extractor || true
            chmod +x ./ci-artifacts/macos-arm/gk ./ci-artifacts/macos-arm/goalc ./ci-artifacts/macos-arm/extractor || true
            cp -v ./.github/scripts/releases/error-code-metadata.json ./ci-artifacts/macos-arm/data/launcher/ 2>&1 || true
            cp -R ./decompiler/config ./ci-artifacts/macos-arm/data/decompiler/ 2>&1 || true
            cp -R ./goal_src ./ci-artifacts/macos-arm/data/ 2>&1 || true
            cp -R ./game/assets ./ci-artifacts/macos-arm/data/game/ 2>&1 || true
            cp -R ./game/graphics/opengl_renderer/shaders ./ci-artifacts/macos-arm/data/game/graphics/opengl_renderer/ 2>&1 || true
            cp -R ./custom_assets ./ci-artifacts/macos-arm/data/ 2>&1 || true
            ls -Rl ./ci-artifacts/macos-arm || true
          fi
          TAG_VAL=${{ needs.cut_release.outputs.new_tag }}
          tar czf ./ci-artifacts/final/opengoal-macos-arm-${TAG_VAL}.tar.gz -C ./ci-artifacts/macos-arm .
          ls -lh ./ci-artifacts/final/ || true
          chmod +x "$BIN_SRC/lsp/lsp" 2>/dev/null || chmod +x "$LSP_PATH" 2>/dev/null || echo "chmod lsp skipped"
          LSP_SRC=$(find "$BIN_SRC" -path "*/lsp/lsp" | head -1)
          [ -z "$LSP_SRC" ] && LSP_SRC="$LSP_PATH"
          if [ -n "$LSP_SRC" ] && [ -f "$LSP_SRC" ]; then
            cp -v "$LSP_SRC" ./ci-artifacts/final/opengoal-lsp-macos-arm-${TAG_VAL}.bin || true
          else
            echo "lsp binary not found, skipping lsp artifact (game tar already built)"
            # create dummy to avoid upload failure if no file
            touch ./ci-artifacts/final/opengoal-lsp-macos-arm-${TAG_VAL}.bin || true
          fi
          ls -lh ./ci-artifacts/final/ || true
          ls -lh ./ci-artifacts/final/

      - name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_VAL=${{ needs.cut_release.outputs.new_tag }}
          gh release upload "${TAG_VAL}" ${{ github.WORKSPACE }}/ci-artifacts/final/* --repo "${{ github.repository }}" --clobber

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_VAL=${{ needs.cut_release.outputs.new_tag }}
          gh release edit ${TAG_VAL} --draft=false --repo "${{ github.repository }}"
