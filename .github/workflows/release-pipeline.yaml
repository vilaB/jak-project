name: 🏭 Draft Release - ARM only (vilaB fork)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver Bump Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      release_version:
        description: 'Explicit release version (e.g. 0.3.8). If set, skips automatic version bump.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  cut_release:
    name: Cut Release
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.set_tag.outputs.new_tag }}
    steps:
      - name: Bump Version and Push Tag
        if: "!inputs.release_version"
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          default_bump: ${{ inputs.bump }}

      - name: Create Explicit Tag
        if: inputs.release_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/git/refs" \
            -f "ref=refs/tags/v${{ inputs.release_version }}" \
            -f "sha=${{ github.sha }}"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            TAG="v${{ inputs.release_version }}"
          else
            TAG="${{ steps.tag_version.outputs.new_tag }}"
          fi
          gh release create "$TAG" \
            --generate-notes \
            --draft \
            --repo "${{ github.repository }}"

      - name: Output new tag
        id: set_tag
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            echo "new_tag=v${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "new_tag=${{ steps.tag_version.outputs.new_tag }}" >> "$GITHUB_OUTPUT"
          fi

  build_macos_arm:
    needs:
      - cut_release
    name: "🍎 MacOS ARM"
    uses: ./.github/workflows/macos-build-arm.yaml
    with:
      cmakePreset: "Release-macos-arm64-clang-static"
      cachePrefix: "static-arm"
      uploadArtifacts: true
    secrets: inherit

  upload_artifacts:
    needs:
      - cut_release
      - build_macos_arm
    name: "Upload ARM Artifacts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.cut_release.outputs.new_tag }}

      - name: Prepare Artifact Folder
        run: mkdir -p ./ci-artifacts/final

      - uses: actions/download-artifact@v8
        with:
          path: ./ci-artifacts/

      - name: Display structure
        run: ls -Rl ./ci-artifacts/

      - name: Prepare ARM macOS Build Assets
        run: |
          echo "=== Artifact structure before fix ==="
          ls -Rl ./ci-artifacts/ || true
          BIN_SRC="./ci-artifacts/opengoal-macos-static-arm"
          # Artifact from upload-artifact v4 is flat or nested - normalize to expected layout
          GK_PATH=$(find "$BIN_SRC" -name "gk" -type f | head -1)
          GOALC_PATH=$(find "$BIN_SRC" -name "goalc" -type f | head -1)
          EXTRACTOR_PATH=$(find "$BIN_SRC" -name "extractor" -type f | head -1)
          LSP_PATH=$(find "$BIN_SRC" -name "lsp" -type f | head -1)
          echo "Found GK:$GK_PATH GOALC:$GOALC_PATH EXTRACTOR:$EXTRACTOR_PATH LSP:$LSP_PATH"
          mkdir -p "$BIN_SRC/game" "$BIN_SRC/goalc" "$BIN_SRC/decompiler" "$BIN_SRC/lsp"
          [ -n "$GK_PATH" ] && cp -f "$GK_PATH" "$BIN_SRC/game/gk" || echo "gk not found"
          [ -n "$GOALC_PATH" ] && cp -f "$GOALC_PATH" "$BIN_SRC/goalc/goalc" || echo "goalc not found"
          [ -n "$EXTRACTOR_PATH" ] && cp -f "$EXTRACTOR_PATH" "$BIN_SRC/decompiler/extractor" || echo "extractor not found"
          [ -n "$LSP_PATH" ] && cp -f "$LSP_PATH" "$BIN_SRC/lsp/lsp" || echo "lsp not found"
          ls -Rl "$BIN_SRC" || true
          mkdir -p ./ci-artifacts/macos-arm
          ./.github/scripts/releases/extract_build_unix.sh ./ci-artifacts/macos-arm "$BIN_SRC" ./
          TAG_VAL=${{ needs.cut_release.outputs.new_tag }}
          tar czf ./ci-artifacts/final/opengoal-macos-arm-${TAG_VAL}.tar.gz -C ./ci-artifacts/macos-arm .
          chmod +x "$BIN_SRC/lsp/lsp"
          cp "$BIN_SRC/lsp/lsp" ./ci-artifacts/final/opengoal-lsp-macos-arm-${TAG_VAL}.bin

      - name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_VAL=${{ needs.cut_release.outputs.new_tag }}
          gh release upload "${TAG_VAL}" ${{ github.WORKSPACE }}/ci-artifacts/final/* --repo "${{ github.repository }}" --clobber

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_VAL=${{ needs.cut_release.outputs.new_tag }}
          gh release edit ${TAG_VAL} --draft=false --repo "${{ github.repository }}"
